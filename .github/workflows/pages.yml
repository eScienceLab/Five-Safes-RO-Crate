name: Build and deploy documentation

on:
  push:
    branches: [1.0]
  pull_request:
    branches: [1.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Markdown
        run: npx --yes markdownlint-cli2@0.24.2 'docs/**/*.md' '*.md'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m mkdocs build
      - name: Generate RO-Crate previews of the Profile Crates
        run: |
          for crate in site/ro-crate-metadata.json site/modules/*/ro-crate-metadata.json; do
            npx --yes --package ro-crate-html@0.1.6 rochtml "$crate"
          done
      - name: Upload pull request preview
        uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: documentation-preview
          path: site/
          retention-days: 3
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/1.0' && github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/1.0' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
