name: Build and deploy documentation

on:
  push:
    branches: [1.0]
  pull_request:
    branches: [1.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Markdown
        run: npx --yes markdownlint-cli2@0.24.2 'docs/**/*.md' 'masp/*.md' '*.md'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m mkdocs build
      - name: Generate documentation of the core profile's MASP rules
        run: |
          mkdir -p "$RUNNER_TEMP/masp"
          cp site/ro-crate-metadata.json "$RUNNER_TEMP/masp/"
          npx --yes --package @crate-works/ro-crate-masp-tools@0.1.0 generate-masp-docs \
            "$RUNNER_TEMP/masp/ro-crate-metadata.json" masp/profile-text.md "$RUNNER_TEMP/masp/profile-documentation.md"
          mkdir -p site/rules
          # the page sits one level below the Profile Crate it documents
          sed 's|rel="describedby" href="ro-crate-metadata.json"|rel="describedby" href="../ro-crate-metadata.json"|' \
            "$RUNNER_TEMP/masp/index.html" > site/rules/index.html
      - name: Generate RO-Crate previews of the Profile Crates
        run: |
          for crate in site/ro-crate-metadata.json site/modules/*/ro-crate-metadata.json site/examples/*/ro-crate-metadata.json; do
            npx --yes --package ro-crate-html@0.1.6 rochtml "$crate"
            # rochtml 0.1.6 omits the HTML5 doctype that RO-Crate 1.3 requires
            sed -i '1s/^/<!DOCTYPE html>\n/' "$(dirname "$crate")/ro-crate-preview.html"
          done
      - name: Upload pull request preview
        uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: documentation-preview
          path: site/
          retention-days: 3
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/1.0' && github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/1.0' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
